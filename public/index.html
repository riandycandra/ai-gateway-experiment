<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Gateway & Evaluation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- SCREEN 1 — Sign In (As-Is Prototype Screen) -->
<section id="login">
  <div class="auth">
    <div class="auth-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/>
      </svg>
      <span style="font-size:15px;font-weight:500;letter-spacing:-.01em">AI Gateway Platform</span>
    </div>
    <h1>Sign in to your account</h1>
    <p class="sub">Manage and evaluate your enterprise AI models & knowledge.</p>
    <div class="auth-card">
      <div class="field">
        <label class="lbl" for="loginEmail">Email</label>
        <input class="input" id="loginEmail" type="email" placeholder="you@company.com" value="dana@northwind.co" />
      </div>
      <div class="field">
        <div class="row"><label class="lbl" for="loginPw">Password</label><a>Forgot password?</a></div>
        <input class="input" id="loginPw" type="password" value="············" />
      </div>
      <button class="btn primary block lg" id="btnSignIn">Sign in</button>
      <div class="sep">or</div>
      <div class="oauth">
        <button class="btn block" id="btnOAuthGithub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.6 4.7 18.6 5 18.6 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
          Continue with GitHub
        </button>
      </div>
    </div>
  </div>
</section>

<!-- SCREEN 2 — Main Dashboard Shell -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/>
      </svg>
      <span>AI Gateway</span>
    </div>
    <div class="crumb">
      <span class="slash">/</span>
      <button class="chip" id="userCompanyChip">Company Dev <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="slash hide-sm">/</span>
      <button class="chip hide-sm">Local Sandbox</button>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnDocs">API Docs</button>
    <div class="avatar" id="userAvatar" title="User">DA</div>
  </header>

  <!-- Sidebar Navigation Rail -->
  <nav class="side" aria-label="Main navigation">
    <div class="side-inner">
      <a class="on" data-nav="overview" title="Overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>Overview</span>
      </a>
      <a data-nav="runs" title="Runs & Evaluations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        <span>Runs & Audit</span>
      </a>
      <a data-nav="jobs" title="Documents & Knowledge Ingestion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/>
        </svg>
        <span>Documents & Ingest</span>
      </a>
      <a data-nav="playground" title="Chat Playground">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Playground</span>
      </a>
      <div class="grow"></div>
      <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
        </svg>
        <span>Active Engine</span>
      </div>
    </div>
  </nav>

  <!-- Dynamic Content Viewport -->
  <main id="main">
    <!-- Rendered dynamically by JavaScript page modules -->
  </main>
</div>

<!-- Reusable Modal Container -->
<div id="modalContainer" class="mbg hidden"></div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- ES Module Bootstrap -->
<script type="module" src="js/app.js"></script>

</body>
</html>
